<!doctype html>
<html lang="ko" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>feedex</title>
    <meta name="description" content="관심 있는 피드를 모아 읽고, 나중에 읽을 글을 저장하는 나만의 RSS 리더" />
    <meta name="theme-color" content="#020617" />
    <script>
      try {
        // 시스템을 고른 경우 처음 그릴 때부터 기기 모드를 따라 깜빡임이 없게 한다.
        const saved = localStorage.getItem('sfeed:theme');
        const theme = saved === 'light' ? 'light' : saved === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : 'dark';
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#020617' : '#f8fafc';
      } catch {}
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="feedex" />
    <meta name="application-name" content="feedex" />
    <!--
      iOS가 상태 표시줄 아래로 앱 크기를 잡게 한다. 예전 반투명 모드는
      독립 실행 웹 보기 아래에 닿을 수 없는 띠를 남길 수 있다.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      (() => {
        let selected;
        try { selected = localStorage.getItem('feedex_language'); } catch {}
        const preferred = navigator.languages?.[0] || navigator.language || 'ko';
        const language = selected === 'ko' || selected === 'en' ? selected : /^ko(?:-|$)/i.test(preferred) ? 'ko' : 'en';
        document.documentElement.lang = language;
        if (language === 'en') {
          document.querySelector('meta[name="description"]').content = 'Follow your favorite RSS feeds, read them in one place, and save articles for later.';
          document.querySelector('link[rel="manifest"]').href = '/manifest.en.webmanifest';
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="1024x1024" href="/icons/icon-1024.png" />
    <!-- 구글 로그인 스크립트는 로그인 화면이 뜰 때만 받는다(LoginView). 이미 로그인한 앱 시작을 늦추지 않는다. -->
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased">
    <!-- 불투명한 상단 색 표본은 React 밖, 앱 오버레이보다 위에 둔다. -->
    <div class="feedex-glass-sample" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
