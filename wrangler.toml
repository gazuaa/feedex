name = "feedex"
main = "src/worker.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

[browser]
binding = "BROWSER"

# Cloudflare D1 서버리스 SQLite 데이터베이스 (APAC)
[[d1_databases]]
binding = "DB"
database_name = "sfeed"
database_id = "3c299f5d-16ca-4ca8-8a07-e37a8565f94d"

# Cloudflare Workers AI (기사 요약용 기본 무료 LLM)
[ai]
binding = "AI"

# 관측 로그 (MUUSED 설정과 같게)
[observability]
enabled = true
head_sampling_rate = 1

# RSS는 15분마다 받고, X 최신 글 요청은 5분 단위로 나눠 보낸다.
[triggers]
crons = ["*/5 * * * *"]

[vars]
OWNER_EMAIL = "jonyq659@gmail.com"
GH_REPO = "gazuaa/feedex"
GOOGLE_CLIENT_ID = "649668487161-f4hutlff1sc7klvplnrm3dki5u3oh3ht.apps.googleusercontent.com"
AI_MODEL = "@cf/meta/llama-3.1-8b-instruct"

# React SPA 빌드 결과를 Cloudflare Workers Static Assets로 서빙한다
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"
