name = "feedex"
main = "src/worker.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

[browser]
binding = "BROWSER"

# Cloudflare D1 서버리스 SQLite 데이터베이스 (APAC)
[[d1_databases]]
binding = "DB"
database_name = "sfeed"
database_id = "3c299f5d-16ca-4ca8-8a07-e37a8565f94d"

# Cloudflare Workers AI (기사 요약용 기본 무료 LLM)
# Slap(같은 계정의 Worker)에 공유할 기사를 맡기는 통로. 서비스 바인딩이라 인터넷 주소가 없고 비밀 키도 필요 없다.
# 아이폰 홈 화면의 Slap 앱은 링크로 열 수 없어서, 맡겨 두면 사용자가 Slap을 열 때 공유 창이 뜬다.
[[services]]
binding = "SLAP"
service = "slap"
entrypoint = "ArticleInbox"

[ai]
binding = "AI"

# 관측 로그 (MUUSED 설정과 같게)
[observability]
enabled = true
head_sampling_rate = 1

# RSS는 15분마다 받고, X 최신 글 요청은 5분 단위로 나눠 보낸다.
[triggers]
crons = ["*/5 * * * *"]

[vars]
OWNER_EMAIL = "jonyq659@gmail.com"
GH_REPO = "gazuaa/feedex"
GOOGLE_CLIENT_ID = "649668487161-f4hutlff1sc7klvplnrm3dki5u3oh3ht.apps.googleusercontent.com"
AI_MODEL = "@cf/google/gemma-4-26b-a4b-it"

# React SPA 빌드 결과를 Cloudflare Workers Static Assets로 서빙한다
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"
